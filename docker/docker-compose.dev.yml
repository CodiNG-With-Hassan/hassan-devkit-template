# COMPOSE_PROJECT_NAME (set per worktree in .env) takes precedence over this
# default; each worktree gets its own container/volume namespace. Host ports
# are DEVKIT_PORT_* driven for the same reason — see docs/WORKTREES.md.
#
# Profiles (COMPOSE_PROFILES in .env, managed by `pnpm worktree:profiles add|remove`):
#   api      — db, backend (mandatory; the default)
#   customer — the web-customer dev server (server-side rendering, the heaviest one)
#   admin    — the web-admin dev server
#   extras   — pgadmin (off by default everywhere, main checkout included)
#
# Dev images are shared across worktrees: template-dev-<svc>:${DEVKIT_IMAGE_TAG},
# where the tag hashes the lockfile + every package.json + the dev Dockerfiles
# (`hassan-devkit worktree:env` computes it and `pnpm docker:dev:up` refreshes it
# on every up). Source is bind-mounted, so worktrees on the
# same lockfile reuse one image and only a dependency bump triggers a build.
#
# Restart policy: dev servers use on-failure:3 — a crash-looping Angular/Nest
# watcher burns CPU forever under `always`, and `always`/`unless-stopped`
# would also bring every dev server back on Docker Desktop launch. Infra
# (cheap, stateful) is unless-stopped: it comes back with the daemon, a dev
# server only when someone runs up.
name: ${COMPOSE_PROJECT_NAME:-template}

# The ${COMPOSE_PROFILES:?...} guard fails every compose command with an
# actionable error while the variable is unset OR empty. It lives in an
# extension field, not a service label, so changing the profile set never
# alters a container's config — `profiles add admin` must not recreate the API.
x-devkit-profiles-guard: ${COMPOSE_PROFILES:?COMPOSE_PROFILES missing or empty in .env - run pnpm worktree:env (writes the default COMPOSE_PROFILES=api), see docs/WORKTREES.md}

services:
  db:
    image: postgres:17-alpine
    profiles: ['api']
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${DB_USERNAME}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - '${DEVKIT_PORT_DB:-5432}:5432'

  backend:
    image: template-dev-backend:${DEVKIT_IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: docker/Dockerfile.dev
    profiles: ['api']
    restart: on-failure:3
    environment:
      - PORT=3000
      - NODE_ENV=development
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - CORS_ORIGIN=${CORS_ORIGIN}
      # Spec provenance: fetch-spec.mjs (pnpm api:types) refuses a spec whose
      # stack/branch stamp doesn't match the checkout it runs in.
      - DEVKIT_STACK=${COMPOSE_PROJECT_NAME:-template}
      - DEVKIT_BRANCH=${DEVKIT_BRANCH:-}
    ports:
      - '${DEVKIT_PORT_API:-3000}:3000'
    depends_on:
      - db
    volumes:
      - ../apps/api:/workspace/apps/api
      - api_node_modules:/workspace/apps/api/node_modules

  customer:
    image: template-dev-customer:${DEVKIT_IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: docker/Dockerfile.customer.dev
    profiles: ['customer']
    restart: on-failure:3
    environment:
      # The dev server renders on the server too: accept this stack's localhost names.
      - NG_ALLOWED_HOSTS=.localhost
      # Origin the server-side render fetches /assets (translations) and /api from:
      # the dev server itself, inside the container (server-absolute-url-interceptor.ts).
      - SSR_SELF_ORIGIN=http://localhost:4200
      # In-container the dev-server /api proxy must target the backend service,
      # not the host (see the app's proxy.conf.mjs).
      - API_PROXY_TARGET=http://backend:3000
    ports:
      - '${DEVKIT_PORT_CUSTOMER:-4200}:4200'
    volumes:
      - ../apps/web-customer:/workspace/apps/web-customer
      - ../libs:/workspace/libs
      - customer_node_modules:/workspace/apps/web-customer/node_modules

  admin:
    image: template-dev-admin:${DEVKIT_IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: docker/Dockerfile.admin.dev
    profiles: ['admin']
    restart: on-failure:3
    environment:
      # In-container the dev-server /api proxy must target the backend service,
      # not the host (see the app's proxy.conf.mjs).
      - API_PROXY_TARGET=http://backend:3000
    ports:
      - '${DEVKIT_PORT_ADMIN:-4201}:4201'
    volumes:
      - ../apps/web-admin:/workspace/apps/web-admin
      - ../libs:/workspace/libs
      - admin_node_modules:/workspace/apps/web-admin/node_modules

  # "extras" is off by default everywhere (main checkout included); opt in
  # with `pnpm worktree:profiles add extras`.
  pgadmin:
    image: dpage/pgadmin4:latest
    profiles: ['extras']
    restart: unless-stopped
    user: root
    entrypoint: /bin/sh -c "chmod 600 /pgpass && /entrypoint.sh"
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@admin.com
      - PGADMIN_DEFAULT_PASSWORD=postgres
      - PGADMIN_CONFIG_SERVER_MODE=False
      - PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED=False
    volumes:
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
      - ./pgadmin/pgpass:/pgpass
    ports:
      - '${DEVKIT_PORT_PGADMIN:-5050}:80'
    depends_on:
      - db

volumes:
  pgdata:
  # node_modules live in named volumes keyed by project + image tag. A dependency
  # bump changes DEVKIT_IMAGE_TAG, so the next up mounts fresh volumes seeded from
  # the new image; `hassan-devkit worktree:env` removes the project's stale-tag
  # volumes.
  api_node_modules:
    name: ${COMPOSE_PROJECT_NAME:-template}_api_node_modules_${DEVKIT_IMAGE_TAG:-latest}
  customer_node_modules:
    name: ${COMPOSE_PROJECT_NAME:-template}_customer_node_modules_${DEVKIT_IMAGE_TAG:-latest}
  admin_node_modules:
    name: ${COMPOSE_PROJECT_NAME:-template}_admin_node_modules_${DEVKIT_IMAGE_TAG:-latest}
