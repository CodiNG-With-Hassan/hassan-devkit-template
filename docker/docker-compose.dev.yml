name: template

services:
  db:
    image: postgres:17-alpine
    restart: always
    environment:
      - POSTGRES_USER=${DB_USERNAME}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - '5432:5432'

  init:
    build:
      context: .
      dockerfile: Dockerfile.init
    depends_on:
      - db
      - minio
    restart: on-failure
    environment:
      PGHOST: db
      PGUSER: ${DB_USERNAME}
      PGPASSWORD: ${DB_PASSWORD}
      MINIO_HOST: minio
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      INIT_BUCKETS: ${INIT_BUCKETS:-uploads avatars}
    volumes:
      - ./scripts/dev-init.sh:/init.sh:ro
    entrypoint: ['/bin/sh', '/init.sh']

  api:
    build:
      context: ../api
      dockerfile: ../docker/Dockerfile.dev
    restart: always
    environment:
      - PORT=3000
      - NODE_ENV=development
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRATION=${JWT_EXPIRATION}
      - CORS_ORIGIN=${CORS_ORIGIN}
      - MAIL_HOST=mailpit
      - MAIL_PORT=1025
      - MAIL_FROM=${MAIL_FROM:-noreply@example.com}
      - FRONTEND_URL=http://localhost:4200
      - MINIO_ENDPOINT=${MINIO_ENDPOINT}
      - MINIO_PORT=${MINIO_PORT}
      - MINIO_USE_SSL=${MINIO_USE_SSL}
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD}
    ports:
      - '3000:3000'
    depends_on:
      - db
    volumes:
      - ../api:/app/
      - /app/node_modules

  spa:
    build:
      context: ../spa
      dockerfile: ../docker/Dockerfile.spa.dev
    restart: always
    environment:
      - CHOKIDAR_USEPOLLING=true
      - CHOKIDAR_INTERVAL=1000
      - ANGULAR_SSR_ALLOWED_HOSTS=.localhost
    ports:
      - '4200:4200'
    volumes:
      - ../spa:/app
      - /app/node_modules

  minio:
    image: minio/minio:latest
    ports:
      - '9000:9000'
      - '9001:9001'
    command: ['server', '--console-address', ':9001', '/data']
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data

  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    restart: unless-stopped
    ports:
      - '5678:5678'
    depends_on:
      - init
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
      - N8N_RUNNERS_ENABLED=true
      - WEBHOOK_URL=http://localhost:5678/
      - GENERIC_TIMEZONE=Europe/Amsterdam
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      - TZ=Europe/Amsterdam
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=db
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=n8n
      - DB_POSTGRESDB_USER=${DB_USERNAME}
      - DB_POSTGRESDB_PASSWORD=${DB_PASSWORD}
    volumes:
      - n8n_data:/home/node/.n8n

  mailpit:
    image: axllent/mailpit:latest
    restart: always
    ports:
      - '1025:1025'
      - '8025:8025'

  pgadmin:
    image: dpage/pgadmin4:latest
    restart: always
    user: root
    entrypoint: /bin/sh -c "chmod 600 /pgpass && /entrypoint.sh"
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@admin.com
      - PGADMIN_DEFAULT_PASSWORD=postgres
      - PGADMIN_CONFIG_SERVER_MODE=False
      - PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED=False
    volumes:
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
      - ./pgadmin/pgpass:/pgpass
    ports:
      - '5050:80'
    depends_on:
      - db

volumes:
  pgdata:
  minio_data:
  n8n_data:
