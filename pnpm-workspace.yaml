packages:
  - apps/*
  - libs/*

# The images already run `pnpm install --frozen-lockfile`; skip pnpm 11's
# pre-`run` deps check, which otherwise tries an interactive node_modules
# purge that aborts headlessly (ERR_PNPM_ABORTED_REMOVE_MODULES_DIR_NO_TTY).
verifyDepsBeforeRun: false

# pnpm 11+ build-script allowlist (replaces v10 onlyBuiltDependencies /
# ignoredBuiltDependencies). true = run install scripts, false = skip.
# Union of the former per-app allowlists.
allowBuilds:
  # api (NestJS)
  '@nestjs/core': true
  unrs-resolver: true
  '@scarf/scarf': false
  # web (Angular build toolchain, pulled in transitively)
  '@parcel/watcher': true
  esbuild: true
  lmdb: true
  msgpackr-extract: true
  # Nx task runner (native binary postinstall)
  nx: true
